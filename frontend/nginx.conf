server {
    listen 80;
    server_name _;

    # Allow large request bodies (e.g. CSV uploads, big report payloads)
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy all API calls to the backend container.
    # "backend" matches the service name in docker-compose.yml.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeout — keyword-report generation can take a few minutes for
        # accounts with many PMax campaigns (one query per category per campaign per period).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;

        # Don't buffer responses (helps streamed responses, large reports)
        proxy_buffering off;
    }

    # SPA fallback — any non-asset, non-API path returns index.html
    # so React Router handles client-side routes (/login, /dashboard, etc.).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Vite outputs hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
