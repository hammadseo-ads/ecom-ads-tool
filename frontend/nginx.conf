# Note: this file becomes nginx.conf.template inside the Docker image. The
# nginx:alpine image automatically runs envsubst over /etc/nginx/templates/*
# at startup, so the ${VAR} placeholders below are filled from container env
# vars before nginx starts.
#
# Required env vars (set on the frontend service):
#   BACKEND_HOST  — internal hostname of the backend service
#                   (e.g. "backend.railway.internal" on Railway, or "backend" in docker-compose)
#   BACKEND_PORT  — port the backend listens on (e.g. "5000")

server {
    listen 80;
    server_name _;

    # Allow large request bodies (e.g. CSV uploads, big report payloads)
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy all API calls to the backend service. Hostname is templated from
    # BACKEND_HOST/BACKEND_PORT env vars (substituted at container startup).
    location /api/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeout — keyword-report generation can take several minutes
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;

        proxy_buffering off;
    }

    # SPA fallback — React Router handles client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Vite outputs hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
