# Note: this file becomes nginx.conf.template inside the Docker image. The
# nginx:alpine image automatically runs envsubst over /etc/nginx/templates/*
# at startup, so the ${VAR} placeholders below are filled from container env
# vars before nginx starts.
#
# Required env vars (set on the frontend service):
#   BACKEND_HOST  — internal hostname of the backend service
#                   (e.g. "backend.railway.internal" on Railway, or "backend" in docker-compose)
#   BACKEND_PORT  — port the backend listens on (e.g. "5000")

server {
    listen 80;
    server_name _;

    # Allow large request bodies (e.g. CSV uploads, big report payloads)
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy all API calls to the backend service. Hostname is templated from
    # BACKEND_HOST/BACKEND_PORT env vars (substituted at container startup).
    #
    # CRITICAL: by default, nginx resolves the upstream hostname ONCE at
    # startup and caches the resulting IP forever. On Railway (and any
    # container platform with rolling deploys), the backend container's
    # internal IP changes whenever it redeploys — leaving nginx connecting
    # to a dead address until the frontend container is also restarted.
    #
    # The fix: assign the upstream into a variable and add a `resolver`
    # directive. nginx will re-resolve the variable on every request,
    # respecting the resolver's TTL.
    location /api/ {
        # RESOLVER_IP is auto-detected from /etc/resolv.conf by the
        # entrypoint script — works on Docker Compose (127.0.0.11),
        # Railway (their internal IP), and any other container runtime.
        # Re-resolve every 30s so backend redeploys with new IPs are
        # picked up automatically (no frontend restart needed).
        resolver ${RESOLVER_IP} ipv6=on valid=30s;
        # Cast hostname into a variable so nginx re-resolves at request time
        # (literal `proxy_pass http://hostname` resolves only once at startup).
        set $backend_upstream "http://${BACKEND_HOST}:${BACKEND_PORT}";
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeout — keyword-report generation can take several minutes
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;

        proxy_buffering off;
    }

    # SPA fallback — React Router handles client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Vite outputs hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
